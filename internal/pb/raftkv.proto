// The wire format of raftkv: the messages Raft nodes send each other, and the
// service clients call. A field number is part of the format, so a number is never
// reused, even after its field is gone.
//
// Regenerate the Go code with `make proto`.
syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/abishekprabakar/raftkv/internal/pb";

// ---------------------------------------------------------------------------
// Between nodes

// Raft carries Raft's messages from one node to another.
service Raft {
  // Stream is opened by the sending node and stays open, one Envelope per
  // message. Raft's replies are one-way messages too, so they travel back on the
  // other node's own stream, never as a response here. The stream returns only
  // when it ends.
  rpc Stream(stream Envelope) returns (StreamClosed);
}

message StreamClosed {}

// Envelope is one Raft message, exactly one of the six kinds in internal/raft.
message Envelope {
  uint64 from = 1;
  // to lets a receiver drop a message meant for another node, which happens if
  // two nodes are given different address lists.
  uint64 to = 2;
  oneof message {
    RequestVoteArgs request_vote = 3;
    RequestVoteReply request_vote_reply = 4;
    AppendEntriesArgs append_entries = 5;
    AppendEntriesReply append_entries_reply = 6;
    InstallSnapshotArgs install_snapshot = 7;
    InstallSnapshotReply install_snapshot_reply = 8;
  }
}

// EntryKind matches raft.EntryKind value for value.
enum EntryKind {
  ENTRY_KIND_COMMAND = 0;
  ENTRY_KIND_NOOP = 1;
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  EntryKind kind = 3;
  bytes data = 4;
}

message RequestVoteArgs {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
  uint64 read_seq = 7;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 read_seq = 3;
  uint64 match_index = 4;
  uint64 conflict_term = 5;
  uint64 conflict_index = 6;
}

message InstallSnapshotArgs {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  uint64 read_seq = 6;
}

message InstallSnapshotReply {
  uint64 term = 1;
  uint64 match_index = 2;
  uint64 read_seq = 3;
}

// ---------------------------------------------------------------------------
// For clients

// KV is the client service. Write and Get are served only by the leader; any
// other node answers with NotLeader so the client can go there instead.
service KV {
  // Write applies a put, append or delete, and returns once it is committed and
  // applied on the leader.
  rpc Write(WriteRequest) returns (WriteResponse);
  // Get reads a key through ReadIndex, so it sees every write acknowledged
  // before it started.
  rpc Get(GetRequest) returns (GetResponse);
  // Status describes the node it is sent to. It is never redirected.
  rpc Status(StatusRequest) returns (StatusResponse);
}

enum Op {
  // The zero value is rejected, so a client that forgets to set op gets an
  // error rather than an accidental put.
  OP_UNSPECIFIED = 0;
  OP_PUT = 1;
  OP_APPEND = 2;
  OP_DELETE = 3;
}

message WriteRequest {
  // client_id and seq name the write. A retry reuses both, and the cluster
  // applies each pair at most once. Both must be nonzero, and a client sends
  // seq+1 only after seq has succeeded.
  uint64 client_id = 1;
  uint64 seq = 2;
  Op op = 3;
  bytes key = 4;
  bytes value = 5; // ignored by delete
}

message WriteResponse {
  NotLeader not_leader = 1; // set if this node could not take the write
  // term is the answering node's term when it acknowledged the write, and 0 with
  // not_leader. A client that watched a leader fail can tell from it which
  // acknowledgements came from the leader elected afterwards.
  uint64 term = 2;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  NotLeader not_leader = 1; // set if this node could not serve the read
  bool found = 2;
  bytes value = 3;
}

// NotLeader says where to go instead. leader_id is 0, and leader_address empty,
// when this node doesn't know who leads.
message NotLeader {
  uint64 leader_id = 1;
  string leader_address = 2;
}

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  string role = 2;
  uint64 term = 3;
  uint64 leader_id = 4;
  string leader_address = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
  uint64 last_log_index = 8;
  uint64 snapshot_index = 9;
}
